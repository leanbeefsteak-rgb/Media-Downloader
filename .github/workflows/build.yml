# Builds Media Downloader for Windows, macOS (Apple Silicon) and macOS (Intel)
# and attaches the results to a GitHub Release.
#
# Two ways to run it:
#   1. Actions tab -> "Build and release" -> "Run workflow" -> type a version (e.g. 1.0.1)
#   2. Push a tag that starts with "v" (e.g. v1.0.1)

name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for this release (e.g. 1.0.1)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: .\build_windows.ps1
      - name: Rename
        shell: pwsh
        run: Move-Item "dist\Media Downloader.exe" "dist\Media-Downloader-windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Media-Downloader-windows.exe

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon
            label: arm64
          - runner: macos-15-intel    # Intel
            label: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.label }}
          path: dist/Media-Downloader-mac-${{ matrix.label }}.zip

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Work out the tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Media Downloader ${{ steps.tag.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            **Windows:** download `Media-Downloader-windows.exe`.
            **Mac (Apple Silicon, 2020 or newer):** download `Media-Downloader-mac-arm64.zip`.
            **Mac (Intel):** download `Media-Downloader-mac-x86_64.zip`.

            First-run warnings on both platforms are expected - see the README for how to get past them.
